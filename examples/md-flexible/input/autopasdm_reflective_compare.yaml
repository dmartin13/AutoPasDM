# End-to-end regression for md-flexible's single-site reflective LJ wall.
#
# Run once with one MPI rank and once with eight ranks. With the 3D subdivision
# below, the eight-rank case uses a 2 x 2 x 2 process grid. The particles are
# farther apart than the interaction cutoff, so every non-zero force comes from
# the reflective wall model.

container: [DirectSum]
traversal: [ds_sequential]
data-layout: [AoS]
newton3: [enabled]
functor: lennard-jones

cutoff: 0.3
verlet-skin-radius: 0.0
tuning-strategies: []
tuning-phases: 0

box-min: [0.0, 0.0, 0.0]
box-max: [8.0, 8.0, 8.0]

deltaT: 0.0
iterations: 1

boundary-type: [reflective, reflective, reflective]
subdivide-dimension: [true, true, true]
load-balancer: None

vtk-filename: autoPasDMReflectiveCompare
vtk-write-frequency: 1
no-progress-bar: true
no-end-config: true

Sites:
  0:
    epsilon: 1.0
    sigma: 1.0
    mass: 1.0

Objects:
  CubeGrid:
    # lower / upper x wall
    0:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [0.5, 2.0, 2.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    1:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [7.5, 2.0, 2.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

    # lower / upper y wall
    2:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [2.0, 0.5, 5.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    3:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [2.0, 7.5, 5.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

    # lower / upper z wall
    4:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [5.0, 2.0, 0.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    5:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [5.0, 2.0, 7.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

    # lower / upper xyz corners
    6:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [0.5, 0.5, 0.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    7:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [7.5, 7.5, 7.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
