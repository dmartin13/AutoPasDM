# Hybrid MPI + OpenMP strong-scaling case for CoolMUC-4.
#
# One MPI rank is intended per compute node, with one AutoPas instance using all
# 112 physical cores of that node through OpenMP. The global problem size stays
# fixed while the number of nodes / MPI ranks is increased.
#
# 128^3 = 2,097,152 particles keeps enough local work per AutoPas instance even
# for several nodes and uses the same density and fixed AutoPas configuration as
# the smaller baseline cases.

container: [LinkedCells]
traversal: [lc_c08]
data-layout: [SoA]
newton3: [enabled]
functor: lennard-jones

cutoff: 2.5
cell-size: [1.0]
verlet-skin-radius: 0.0
tuning-strategies: []
tuning-phases: 0

box-min: [0.0, 0.0, 0.0]
box-max: [128.0, 128.0, 128.0]

deltaT: 1.0e-6
iterations: 100

boundary-type: [periodic, periodic, periodic]
subdivide-dimension: [true, true, true]
load-balancer: None
load-balancing-interval: 10

no-progress-bar: true
no-end-config: true

Sites:
  0:
    epsilon: 1.0
    sigma: 1.0
    mass: 1.0

Objects:
  CubeGrid:
    0:
      particles-per-dimension: [128, 128, 128]
      particle-spacing: 1.0
      bottomLeftCorner: [0.5, 0.5, 0.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
