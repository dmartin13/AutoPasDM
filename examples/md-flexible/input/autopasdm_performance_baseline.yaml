# Static performance baseline shared by original md-flexible and AutoPasDM.
#
# The AutoPas search space is deliberately fixed to avoid tuning noise. Load balancing
# is disabled here so that the first benchmark isolates the cost of the distributed
# synchronization path (container update + migration + halo exchange).

container: [LinkedCells]
traversal: [lc_c08]
data-layout: [SoA]
newton3: [enabled]
functor: lennard-jones

cutoff: 2.5
cell-size: [1.0]
verlet-skin-radius: 0.0
tuning-strategies: []
tuning-phases: 0

box-min: [0.0, 0.0, 0.0]
box-max: [16.0, 16.0, 16.0]

deltaT: 1.0e-6
iterations: 100

boundary-type: [periodic, periodic, periodic]
subdivide-dimension: [true, true, true]
load-balancer: None
load-balancing-interval: 10

no-progress-bar: true
no-end-config: true

Sites:
  0:
    epsilon: 1.0
    sigma: 1.0
    mass: 1.0

Objects:
  CubeGrid:
    0:
      particles-per-dimension: [16, 16, 16]
      particle-spacing: 1.0
      bottomLeftCorner: [0.5, 0.5, 0.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
