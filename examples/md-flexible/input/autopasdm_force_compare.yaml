# Force-comparison test for AutoPasDM + md-flexible.
# The setup is deliberately 1D: periodic only in x, no boundaries in y/z.
# deltaT=0 keeps positions fixed so a 1-rank and 4-rank run can be compared directly.

container: [DirectSum]
traversal: [ds_sequential]
data-layout: [AoS]
newton3: [enabled]
functor: lennard-jones

cutoff: 1.5
verlet-skin-radius: 0.0
tuning-strategies: []
tuning-phases: 0

box-min: [0.0, 0.0, 0.0]
box-max: [8.6, 8.0, 8.0]

deltaT: 0.0
iterations: 1

boundary-type: [periodic, none, none]
subdivide-dimension: [true, false, false]
load-balancer: None

vtk-filename: autoPasDMForceCompare
vtk-write-frequency: 1
no-progress-bar: true
no-end-config: true

Sites:
  0:
    epsilon: 1.0
    sigma: 1.0
    mass: 1.0

# Irregular x positions make the resulting forces non-zero and ensure that
# interactions cross both internal MPI boundaries and the periodic x boundary.
Objects:
  CubeGrid:
    0:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 1.0
      bottomLeftCorner: [0.4, 4.0, 4.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    1:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 1.0
      bottomLeftCorner: [1.4, 4.0, 4.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
