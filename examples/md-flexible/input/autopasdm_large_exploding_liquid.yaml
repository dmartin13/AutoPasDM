# Large-scale 3D exploding-liquid slab for md-flexible + AutoPasDM.
#
# Dense HCP slab:
#   box-length [256, 48, 256], spacing 1.0
#   -> approximately 4.5 million particles
#
# The slab starts compressed relative to the LJ equilibrium spacing and expands
# into the surrounding vacuum. It spans x and z and crosses the central y
# process-grid boundary for common even process grids.
#
# This scenario is intentionally more load-imbalanced than the spinodal case.
# It is therefore particularly interesting later for adaptive load balancing.
#
# VTK output is disabled by default because it becomes very expensive at this scale.

container                        : [LinkedCells]
traversal                        : [lc_c08]
data-layout                      : [SoA]
newton3                          : [enabled]
vectorization-pattern            : [1xVectorLength]

verlet-rebuild-frequency         : 10
verlet-skin-radius               : 0.5
cell-size                        : [1]

tuning-strategies                : []
functor                          : Lennard-Jones-HWY

cutoff                           : 2.5
box-min                          : [-0.5, 0.0, -0.5]
box-max                          : [256.5, 256.0, 256.5]

deltaT                           : 0.00182367
iterations                       : 30000

boundary-type                    : [periodic, periodic, periodic]
subdivide-dimension              : [true, true, true]
load-balancer                    : none

Sites:
  0:
    epsilon                      : 1.0
    sigma                        : 1.0
    mass                         : 1.0

Objects:
  CubeClosestPacked:
    0:
      particle-type-id           : 0
      box-length                 : [256.0, 48.0, 256.0]
      bottomLeftCorner           : [0.0, 104.0, 0.0]
      particle-spacing           : 1.0
      velocity                   : [0.0, 0.0, 0.0]

no-end-config                    : true
no-progress-bar                  : true
log-level                        : info

# Optional visualization. Enable only for selected runs.
# vtk-filename                   : autoPasDMLargeExplodingLiquid
# vtk-write-frequency            : 1000
# vtk-output-folder              : vtkOutputFolder
