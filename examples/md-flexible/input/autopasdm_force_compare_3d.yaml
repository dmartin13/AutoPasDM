# 3D force-comparison regression test for AutoPasDM + md-flexible.
#
# Run with 1 and 8 MPI ranks and compare final owned-particle forces.
# With 8 ranks and subdivide-dimension enabled in all dimensions, AutoPasDM uses a
# 2 x 2 x 2 process grid.
#
# The particle pairs deliberately exercise:
# - internal x, y, and z face boundaries
# - an internal xy edge
# - an internal xyz corner
# - periodic x, y, and z boundaries
# - the periodic xyz corner
#
# particle-spacing is intentionally small because every CubeGrid contains only
# one particle. This prevents md-flexible from enlarging the explicitly chosen
# [0, 8]^3 periodic simulation box.

container: [DirectSum]
traversal: [ds_sequential]
data-layout: [AoS]
newton3: [enabled]
functor: lennard-jones

cutoff: 1.5
verlet-skin-radius: 0.0
tuning-strategies: []
tuning-phases: 0

box-min: [0.0, 0.0, 0.0]
box-max: [8.0, 8.0, 8.0]

deltaT: 0.0
iterations: 1

boundary-type: [periodic, periodic, periodic]
subdivide-dimension: [true, true, true]
load-balancer: None

vtk-filename: autoPasDMForceCompare3D
vtk-write-frequency: 1
no-progress-bar: true
no-end-config: true

Sites:
  0:
    epsilon: 1.0
    sigma: 1.0
    mass: 1.0

Objects:
  # Internal x face at x = 4.
  CubeGrid:
    0:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [3.5, 1.0, 1.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    1:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [4.5, 1.0, 1.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

  # Internal y face at y = 4.
  CubeGrid:
    2:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [1.0, 3.5, 3.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    3:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [1.0, 4.5, 3.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

  # Internal z face at z = 4.
  CubeGrid:
    4:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [3.0, 1.0, 3.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    5:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [3.0, 1.0, 4.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

  # Internal xy edge.
  CubeGrid:
    6:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [3.6, 3.6, 6.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    7:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [4.4, 4.4, 6.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

  # Internal xyz corner.
  CubeGrid:
    8:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [3.6, 3.6, 3.6]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    9:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [4.4, 4.4, 4.4]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

  # Periodic x boundary.
  CubeGrid:
    10:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [0.4, 6.5, 1.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    11:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [7.6, 6.5, 1.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

  # Periodic y boundary.
  CubeGrid:
    12:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [6.5, 0.4, 3.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    13:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [6.5, 7.6, 3.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

  # Periodic z boundary.
  CubeGrid:
    14:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [2.5, 6.0, 0.4]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    15:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [2.5, 6.0, 7.6]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0

  # Periodic xyz corner.
  CubeGrid:
    16:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [0.4, 0.4, 0.4]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    17:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [7.6, 7.6, 7.6]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
